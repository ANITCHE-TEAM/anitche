# En-têtes des réponses HTML d'un portail (inclus par portail.conf, qui doit
# les répéter dans chaque location : un add_header dans une location annule
# ceux du bloc server). __PORTAIL__ est remplacé par Dockerfile.prod.
#
# Les autres en-têtes de sécurité (nosniff, X-Frame-Options, Referrer-Policy,
# identifiant de requête) sont ajoutés par le nginx de devant
# (infra/nginx/serveur-commun.conf) : les répéter les enverrait en double.
add_header X-Portail "__PORTAIL__" always;

# Politique de contenu : tout vient de l'origine du portail ('self'), rien
# d'un tiers, et ni script ni style en ligne dans le HTML.
#   default-src 'self'      scripts, images, polices, API (/api/ et /fast/, y
#                           compris le WebSocket) : même origine seulement.
#                           Aucun eval, aucun script en ligne.
#   style-src 'self'        feuilles de style du bundle (Tailwind est compilé
#                           en fichier) ; aucun attribut style="" dans le HTML.
#                           Les styles posés par React (propriété style) passent
#                           par le CSSOM, que la CSP ne bloque pas.
#   style-src-elem 'self' 'unsafe-inline'
#                           balises <style> créées à l'exécution par les
#                           bibliothèques : Radix (ScrollArea, Select), le
#                           verrou de défilement des fenêtres modales
#                           (react-remove-scroll) et sonner. Ces balises n'ont
#                           ni nonce ni empreinte possibles dans un bundle
#                           statique, d'où 'unsafe-inline', limité aux balises.
#   object-src 'none'       ni Flash ni plugin.
#   base-uri 'self'         une balise <base> injectée ne détourne pas les URL.
#   form-action 'self'      un formulaire ne peut pas être envoyé à un tiers.
#   frame-ancestors 'none'  aucun site ne peut intégrer le portail (clickjacking).
# Pas de blob: ni data: (images), pas de domaine de tuiles de carte : à
# ajouter ici, avec la page qui l'exige, le jour où elle existe.
add_header Content-Security-Policy "default-src 'self'; style-src 'self'; style-src-elem 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
