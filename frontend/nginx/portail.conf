# Serveur d'un portail React (application d'une seule page) dans l'image
# nginx sans root, port 8080. Le nginx de devant (infra/nginx/nginx.conf) lui
# transmet les pages du sous-domaine ; /api/ et /fast/ ne passent jamais par
# ici.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fichiers du bundle (Vite) : leur nom contient l'empreinte de leur
    # contenu, donc un fichier ne change jamais. Un fichier absent est un 404 :
    # le repli ci-dessous renverrait index.html à la place d'un script, et le
    # navigateur l'afficherait comme une erreur de syntaxe. Sans « always » :
    # le cache d'un an ne s'applique qu'aux réponses réussies, jamais à un 404.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (appelé directement ou en repli) : toujours revalidé, sinon un
    # navigateur garde l'ancien et charge des fichiers d'assets supprimés par le
    # déploiement suivant.
    # Repli de l'application : une URL profonde (/commandes/12) n'est pas un
    # fichier, le navigateur reçoit index.html et le routeur du portail affiche
    # la bonne page.
    location / {
        include /etc/nginx/portail-en-tetes.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
