packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@eslint/js": 10.0.1
  "@testing-library/dom": 10.4.2
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/react": 16.3.3
  "@types/node": 22.20.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  eslint: 10.12.0
  eslint-plugin-boundaries: 7.2.0
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.7
  globals: 17.13.0
  jsdom: 30.1.2
  react: 19.3.0
  react-dom: 19.3.0
  turbo: 2.11.7
  typescript: 6.0.3
  typescript-eslint: 8.71.1
  vite: 8.3.3
  vitest: 5.0.3

# Dérogation ajoutée par pnpm 12 à l'installation : vite 8.3.3 est plus jeune que le délai
# minimum de pnpm (minimumReleaseAge), qui bloquerait sinon son installation.
# À retirer (avec cette entrée) quand vite 8.3.3 aura dépassé ce délai.
minimumReleaseAgeExclude:
  - vite@8.3.3
