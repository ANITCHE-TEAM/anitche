# Ce que servent ENSEMBLE le domaine principal et chaque sous-domaine de
# portail : inclus au début de chaque bloc « server » 443 de nginx.conf, qui
# ajoute ensuite son certificat, sa location « / » (le portail du nom) et, pour
# le domaine principal seulement, /admin/ et /static/.
#
# Un portail et l'API partagent ainsi une même origine : /api/ et /fast/ sont
# appelés sur le sous-domaine lui-même (pas de CORS, la CSP des portails
# n'autorise que 'self'). Les médias publics y sont aussi : Django construit
# leurs adresses avec l'hôte de la requête (https://<sous-domaine>/media/...).
#
# Fichier lu tel quel (aucune variable d'environnement n'y est remplacée).

client_max_body_size 20M;

access_log /dev/stdout anitche;

# Résolution DNS des services que Docker peut recréer avec une autre IP :
# chaque proxy_pass passe par une variable ($amont_*), donc le nom est
# résolu ici (réponse gardée 10 s) et non une fois pour toutes au démarrage.
# nginx démarre même si l'un d'eux est absent (502 tant qu'il manque) et suit
# un conteneur recréé, sans reload. 127.0.0.11 est le DNS interne de Docker.
resolver 127.0.0.11 valid=10s ipv6=off;

# En-têtes de sécurité (A05) : appliqués à toutes les réponses, y compris
# celles des portails et les erreurs de nginx elles-mêmes. La CSP des
# portails est ajoutée par leur propre nginx (frontend/nginx/en-tetes.conf).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "1; mode=block" always;
# Identifiant de la requête, renvoyé au client (y compris sur une erreur
# produite par nginx) et écrit dans le journal (rid=). Aucun backend ne
# l'envoie lui-même.
add_header X-Request-ID $request_id always;

# Les en-têtes ci-dessus ne sont hérités que par les locations SANS
# add_header : les durées de cache passent donc par « expires », jamais par
# add_header.

# Routes de santé INTERNES (healthchecks compose, depuis les conteneurs) :
# jamais servies à l'extérieur. Django ne les expose qu'à la racine
# (/health/), hors des préfixes proxifiés ; sans ces blocs, la requête
# tomberait dans le portail (qui répondrait 200 par son repli).
location = /health {
    return 404;
}

location = /health/ {
    return 404;
}

# Préfixe : couvre /fast/health et ses variantes, avant le bloc /fast/.
location ^~ /fast/health {
    return 404;
}

# Django : API coeur métier. proxy_pass SANS chemin (variable sans URI) :
# nginx transmet l'URI d'origine telle quelle (/api/... arrive en /api/...,
# comme l'attend config/urls.py). Un « / » final remplacerait /api/ par / et
# toute l'API répondrait 404.
location /api/ {
    set $amont_django http://backend-django:8000;
    proxy_pass $amont_django;
    include /etc/nginx/anitche/proxy-en-tetes.conf;
}

# Route interne de vérification du jeton (apps/utilisateurs/views.py,
# VerificationJetonServiceView) : réservée à FastAPI, qui l'appelle
# directement sur le réseau Docker (http://backend-django:8000/api/...), sans
# passer par ici. Depuis Internet : 404, sans atteindre Django. Préfixe sans
# « / » final et ^~ : couvre aussi la variante sans « / » et passe avant
# toute location regex. nginx compare l'URI normalisée (« // », « ./ »,
# « ../ » et %XX décodés) : ces variantes sont bloquées.
location ^~ /api/utilisateurs/jeton/verification {
    return 404;
}

# Médias PUBLICS uniquement (volume anitche_media, lecture seule), un
# préfixe par champ public (upload_to) :
#   catalogue/categories/  Categorie.image
#   catalogue/produits/    ImageProduit.image
#   boutiques/logos/       Boutique.logo
#   boutiques/bannieres/   Boutique.banniere
# Un nouveau champ fichier public doit être ajouté ici ; un champ privé ne
# doit JAMAIS l'être.
location ~ ^/media/(?:catalogue/(?:categories|produits)|boutiques/(?:logos|bannieres))/ {
    root /srv;
    expires 7d;
    access_log off;
}

# Tout le reste sous /media/ est privé : kyc/ (pièces d'identité, selfies),
# support/pieces_jointes/, retours/preuves/. Ces fichiers ne sortent que par
# les vues Django qui contrôlent le propriétaire. Ce 404 est indispensable
# sur chaque sous-domaine : sans lui, /media/... tomberait dans le portail,
# dont le repli répond 200.
location /media/ {
    return 404;
}

# FastAPI : recherche, IA, QR code, temps réel (WebSocket compris). Le nom du
# service est résolu à chaque requête (resolver ci-dessus) : il passe par une
# variable. proxy_pass avec une variable ne retire plus le préfixe tout seul,
# d'où le rewrite explicite (/fast/x arrive en /x ; ROOT_PATH=/fast côté
# FastAPI) ; la chaîne de requête est conservée. FastAPI absent : 502, sans
# empêcher nginx de démarrer.
location /fast/ {
    set $amont_fastapi http://backend-fastapi:8001;
    rewrite ^/fast/(.*)$ /$1 break;
    proxy_pass $amont_fastapi;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    include /etc/nginx/anitche/proxy-en-tetes.conf;
}
