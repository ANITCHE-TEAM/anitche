# En-têtes transmis aux services derrière nginx (portails, Django, FastAPI),
# inclus par chaque location qui fait un proxy_pass : une location qui
# déclare ses propres proxy_set_header doit les lister tous.
#
# X-Forwarded-For est ÉCRASÉ par $remote_addr (et non complété par
# $proxy_add_x_forwarded_for, qui recopierait la valeur envoyée par le
# client) : le backend reçoit une seule IP, de confiance.
# $scheme reflète le protocole réellement utilisé par le bloc serveur (donc
# « https ») : nginx l'impose lui-même plutôt que de relayer un en-tête venant
# du client, qui pourrait sinon être forgé par quiconque contournerait
# Cloudflare pour taper directement l'IP du serveur.
# X-Request-ID : identifiant généré par nginx pour chaque requête
# ($request_id), écrit dans le journal de Gunicorn ; celui qu'enverrait le
# client est écrasé.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
