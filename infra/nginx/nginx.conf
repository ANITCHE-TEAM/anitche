# Nginx = point d'entrée unique en production.
# - "/"      -> conteneur frontend (React buildé, servi par un nginx interne)
# - "/api/"  -> Django (coeur métier, admin, CRUD)
# - "/fast/" -> FastAPI (recherche, IA, QR, temps réel)
#
# Les noms "frontend", "backend-django", "backend-fastapi" sont résolus par
# Docker grâce au réseau créé automatiquement par docker-compose.prod.yml.
#
# F-18 (audit sécurité) : Cloudflare (mode Full Strict) termine le TLS public
# côté visiteur, mais rechiffre ensuite vers CE serveur — Full Strict exige un
# certificat valide côté origine, d'où le bloc 443 ci-dessous avec un
# certificat Let's Encrypt (voir infra/scripts/init-lets-encrypt.sh pour
# l'émission initiale, et le service "certbot" de docker-compose.prod.yml
# pour le renouvellement automatique).
#
# Domaine : anitche.com / www.anitche.com (voir infra/.env.example). À adapter
# ici ET dans infra/scripts/init-lets-encrypt.sh si le domaine change.

# Redirige tout HTTP vers HTTPS, sauf le challenge ACME de Let's Encrypt qui
# doit rester accessible en clair (c'est justement lui qui prouve la
# possession du domaine avant qu'un certificat HTTPS n'existe).
server {
    listen 80;
    server_name anitche.com www.anitche.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name anitche.com www.anitche.com;

    ssl_certificate     /etc/letsencrypt/live/anitche.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anitche.com/privkey.pem;

    # Seuls TLS 1.2/1.3 : les versions antérieures (SSLv3, TLS 1.0/1.1) sont
    # cassées cryptographiquement et interdites par les référentiels récents
    # (PCI-DSS notamment, pertinent pour un site marchand qui manipule des
    # paiements).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20M;

    # En-têtes de sécurité (A05) : appliqués à toutes les réponses,
    # y compris celles du frontend statique et les erreurs Nginx elles-mêmes.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Frontend (React statique)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $scheme reflète le protocole réellement utilisé par CE bloc serveur
        # (donc "https" ici) — Nginx l'impose lui-même plutôt que de relayer
        # un en-tête venant du client, qui pourrait sinon être forgé par
        # quiconque contournerait Cloudflare pour taper directement l'IP du
        # serveur.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django : API coeur métier + admin
    location /api/ {
        proxy_pass http://backend-django:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend-django:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI : recherche, IA, QR code, temps réel (WebSocket compris)
    location /fast/ {
        proxy_pass http://backend-fastapi:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
