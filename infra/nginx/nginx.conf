# Nginx = point d'entrée unique en production.
# - "/"      -> conteneur frontend (React buildé, servi par un nginx interne)
# - "/api/"  -> Django (coeur métier, admin, CRUD)
# - "/fast/" -> FastAPI (recherche, IA, QR, temps réel)
#
# Les noms "frontend", "backend-django", "backend-fastapi" sont résolus par
# Docker grâce au réseau créé automatiquement par docker-compose.prod.yml.
#
# F-18 (audit sécurité) : Cloudflare (mode Full Strict) termine le TLS public
# côté visiteur, mais rechiffre ensuite vers CE serveur — Full Strict exige un
# certificat valide côté origine, d'où le bloc 443 ci-dessous avec un
# certificat Let's Encrypt (voir infra/scripts/init-lets-encrypt.sh pour
# l'émission initiale, et le service "certbot" de docker-compose.prod.yml
# pour le renouvellement automatique).
#
# Domaine : anitche.com / www.anitche.com (voir infra/.env.example). À adapter
# ici ET dans infra/scripts/init-lets-encrypt.sh si le domaine change.

# Adresse IP réelle du visiteur (limites de débit et journaux côté Django).
# Derrière Cloudflare, $remote_addr est l'IP d'un serveur Cloudflare, pas
# celle du visiteur. Le module real_ip la remplace par l'en-tête
# CF-Connecting-IP, mais UNIQUEMENT quand la connexion vient d'une plage
# Cloudflare listée ci-dessous : un client qui contourne Cloudflare pour
# taper directement l'IP du serveur ne peut donc pas forger cet en-tête
# ($remote_addr reste alors sa vraie IP TCP). Si Cloudflare est un jour
# retiré de la chaîne, ce bloc devient simplement sans effet.
#
# Chaque location ci-dessous ÉCRASE ensuite X-Forwarded-For avec
# $remote_addr (au lieu de $proxy_add_x_forwarded_for, qui recopiait la
# valeur envoyée par le client) : Django reçoit une seule IP, de confiance
# (REST_FRAMEWORK['NUM_PROXIES'] = 1 dans config/settings/prod.py).
#
# Plages officielles : https://www.cloudflare.com/ips/ (relevées le
# 2026-09-25). À revérifier périodiquement : une plage manquante ne crée pas
# de faille, mais les visiteurs passant par elle partageraient l'IP d'un
# serveur Cloudflare dans les limites de débit.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Redirige tout HTTP vers HTTPS, sauf le challenge ACME de Let's Encrypt qui
# doit rester accessible en clair (c'est justement lui qui prouve la
# possession du domaine avant qu'un certificat HTTPS n'existe).
server {
    listen 80;
    server_name anitche.com www.anitche.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name anitche.com www.anitche.com;

    ssl_certificate     /etc/letsencrypt/live/anitche.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anitche.com/privkey.pem;

    # Seuls TLS 1.2/1.3 : les versions antérieures (SSLv3, TLS 1.0/1.1) sont
    # cassées cryptographiquement et interdites par les référentiels récents
    # (PCI-DSS notamment, pertinent pour un site marchand qui manipule des
    # paiements).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20M;

    # En-têtes de sécurité (A05) : appliqués à toutes les réponses,
    # y compris celles du frontend statique et les erreurs Nginx elles-mêmes.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Frontend (React statique)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # $scheme reflète le protocole réellement utilisé par CE bloc serveur
        # (donc "https" ici) — Nginx l'impose lui-même plutôt que de relayer
        # un en-tête venant du client, qui pourrait sinon être forgé par
        # quiconque contournerait Cloudflare pour taper directement l'IP du
        # serveur.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django : API coeur métier + admin
    location /api/ {
        proxy_pass http://backend-django:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend-django:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI : recherche, IA, QR code, temps réel (WebSocket compris)
    location /fast/ {
        proxy_pass http://backend-fastapi:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
