# Nginx = point d'entrée unique en production.
# - "/"      -> conteneur frontend (React buildé, servi par un nginx interne)
# - "/api/"  -> Django (coeur métier, admin, CRUD)
# - "/fast/" -> FastAPI (recherche, IA, QR, temps réel)
#
# Les noms "frontend", "backend-django", "backend-fastapi" sont résolus par
# Docker grâce au réseau créé automatiquement par docker-compose.prod.yml.

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # En-têtes de sécurité (A05) : appliqués à toutes les réponses,
    # y compris celles du frontend statique et les erreurs Nginx elles-mêmes.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Frontend (React statique)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Django : API coeur métier + admin
    location /api/ {
        proxy_pass http://backend-django:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend-django:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # FastAPI : recherche, IA, QR code, temps réel (WebSocket compris)
    location /fast/ {
        proxy_pass http://backend-fastapi:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}