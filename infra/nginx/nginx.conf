# Nginx = point d'entrée unique en production, sur le domaine ${DOMAIN}
# (BACKEND_BASE_URL=https://${DOMAIN}, voir infra/.env.example) :
# - "/"        -> conteneur frontend (React buildé, servi par un nginx interne)
# - "/api/"    -> Django, chemin COMPLET transmis (/api/x arrive en /api/x,
#                 config/urls.py), dont les notifications de paiement
#                 /api/paiements/webhook/geniuspay/ (et .../transfert/)
#   sauf "/api/utilisateurs/jeton/verification" -> 404 (route interne)
# - "/admin/"  -> Django (administration), chemin complet, seulement pour les
#                 adresses de ADMIN_ALLOWED_CIDRS ; 403 pour toutes les autres
#                 (liste vide : fermé à tous, docs/DEPLOIEMENT.md)
# - "/fast/"   -> FastAPI, préfixe /fast retiré (/fast/x arrive en /x ;
#                 ROOT_PATH=/fast côté FastAPI), WebSocket compris
# - "/static/" -> fichiers de collectstatic, servis ici (volume anitche_static)
# - "/media/"  -> UNIQUEMENT les médias publics, servis ici (volume
#                 anitche_media en lecture seule) ; tout autre chemin -> 404.
#                 Les fichiers privés (KYC, pièces jointes du support, photos
#                 des retours) ne sortent que par les vues protégées de Django.
#
# Les noms "frontend", "backend-django", "backend-fastapi" sont résolus par
# le DNS interne de Docker à chaque requête (resolver du bloc 443) : nginx
# démarre sans eux et suit un conteneur recréé avec une autre adresse IP.
#
# Cloudflare (mode Full Strict) termine le TLS public
# côté visiteur, mais rechiffre ensuite vers CE serveur — Full Strict exige un
# certificat valide côté origine, d'où le bloc 443 ci-dessous avec un
# certificat Let's Encrypt (voir infra/scripts/init-lets-encrypt.sh pour
# l'émission initiale, et le service "certbot" de docker-compose.prod.yml
# pour le renouvellement automatique). nginx relit le certificat renouvelé
# en se rechargeant toutes les NGINX_RELOAD_INTERVAL
# (infra/nginx/entrypoint.d/50-anitche-rechargement.sh).
#
# CE FICHIER EST UN MODÈLE : le conteneur nginx le reçoit en
# /etc/nginx/templates/default.conf.template et l'image officielle le
# recopie au démarrage en /etc/nginx/conf.d/default.conf, en remplaçant les
# références aux variables DOMAIN, DOMAIN_VENDEUR, DOMAIN_LIVREUR et
# DOMAIN_ADMIN par leurs valeurs (envsubst, limité à ces noms par
# NGINX_ENVSUBST_FILTER : les variables de nginx comme $host restent
# intactes). Aucun nom de domaine n'est écrit ici. Après une modification de
# ce fichier, nginx doit le relire : deploy.sh le fait.
#
# Domaines servis : ${DOMAIN} et www.${DOMAIN} en HTTPS ; les sous-domaines
# des portails (${DOMAIN_VENDEUR}, ${DOMAIN_LIVREUR}, ${DOMAIN_ADMIN}) ne
# sont, pour l'instant, servis qu'en HTTP pour le challenge ACME et la
# redirection vers HTTPS (certificat unique couvrant tous ces noms). Tout
# autre nom (Host ou SNI inconnu, accès par l'adresse IP) : connexion fermée
# par les blocs default_server, sans réponse.

# TLS au niveau http, commun à tous les blocs 443 : la version du protocole
# se négocie avant que nginx ne choisisse le bloc d'après le SNI.
# Seuls TLS 1.2/1.3 : les versions antérieures (SSLv3, TLS 1.0/1.1) sont
# cassées cryptographiquement et interdites par les référentiels récents
# (PCI-DSS notamment, pertinent pour un site marchand qui manipule des
# paiements).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# Adresse IP réelle du visiteur (limites de débit et journaux côté Django).
# Derrière Cloudflare, $remote_addr est l'IP d'un serveur Cloudflare, pas
# celle du visiteur. Le module real_ip la remplace par l'en-tête
# CF-Connecting-IP, mais UNIQUEMENT quand la connexion vient d'une plage
# Cloudflare listée ci-dessous : un client qui contourne Cloudflare pour
# taper directement l'IP du serveur ne peut donc pas forger cet en-tête
# ($remote_addr reste alors sa vraie IP TCP). Si Cloudflare est un jour
# retiré de la chaîne, ce bloc devient simplement sans effet.
#
# Chaque location ci-dessous ÉCRASE ensuite X-Forwarded-For avec
# $remote_addr (et non $proxy_add_x_forwarded_for, qui recopierait la
# valeur envoyée par le client) : Django reçoit une seule IP, de confiance
# (REST_FRAMEWORK['NUM_PROXIES'] = 1 dans config/settings/prod.py).
#
# Plages officielles : https://www.cloudflare.com/ips/ (relevées le
# 2026-09-25). À revérifier périodiquement : une plage manquante ne crée pas
# de faille, mais les visiteurs passant par elle partageraient l'IP d'un
# serveur Cloudflare dans les limites de débit.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# WebSocket (/fast/) : « Connection: upgrade » uniquement quand le client
# demande réellement une mise à niveau ; sinon « close », comme le ferait
# nginx sans ces en-têtes.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Journal d'accès : identifiant de requête (X-Request-ID, rid=) pour relier
# le signalement d'un utilisateur à une ligne de journal, et chemin sans la
# chaîne de requête (elle peut contenir un jeton), sans référent.
log_format anitche '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_user_agent" rid=$request_id';

# Host ou SNI inconnus (scans par adresse IP, noms qui ne sont pas les
# nôtres) : connexion fermée sans réponse (444), avant d'atteindre un
# backend ; en HTTPS, la poignée de main TLS est refusée, donc aucun
# certificat n'est montré. « return 444 » dans le bloc 443 couvre une
# requête dont le SNI est connu mais l'en-tête Host inconnu.
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    access_log off;
    ssl_reject_handshake on;
    return 444;
}

# Redirige tout HTTP vers HTTPS, sauf le challenge ACME de Let's Encrypt qui
# doit rester accessible en clair (c'est justement lui qui prouve la
# possession du domaine avant qu'un certificat HTTPS n'existe). Tous les noms
# du certificat y figurent, sous-domaines des portails compris.
server {
    listen 80;
    server_name ${DOMAIN} www.${DOMAIN} ${DOMAIN_VENDEUR} ${DOMAIN_LIVREUR} ${DOMAIN_ADMIN};

    access_log /dev/stdout anitche;
    add_header X-Request-ID $request_id always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Healthcheck du conteneur nginx : écoute sur la boucle locale du conteneur
# seulement, donc injoignable depuis le réseau Docker comme depuis Internet
# (allow/deny n'aurait aucun effet sur un « return », exécuté avant la phase
# d'accès).
server {
    listen 127.0.0.1:8081;
    access_log off;

    location = /nginx-health {
        default_type text/plain;
        return 200 "ok";
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN} www.${DOMAIN};

    # Certificat de nom ${DOMAIN} (certbot --cert-name), qui couvre aussi
    # www et les sous-domaines des portails (infra/scripts/init-lets-encrypt.sh).
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    client_max_body_size 20M;

    access_log /dev/stdout anitche;

    # Résolution DNS des services que Docker peut recréer avec une autre IP :
    # chaque proxy_pass ci-dessous passe par une variable ($amont_*), donc
    # le nom est résolu ici (réponse gardée 10 s) et non une fois pour toutes
    # au démarrage. nginx démarre même si l'un d'eux est absent (502 tant
    # qu'il manque) et suit un conteneur recréé, sans reload.
    # 127.0.0.11 est le DNS interne de Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # En-têtes de sécurité (A05) : appliqués à toutes les réponses,
    # y compris celles du frontend statique et les erreurs Nginx elles-mêmes.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Identifiant de la requête, renvoyé au client (y compris sur une erreur
    # produite par nginx) et écrit dans le journal (rid=). Aucun backend ne
    # l'envoie lui-même.
    add_header X-Request-ID $request_id always;

    # Les en-têtes ci-dessus ne sont hérités que par les locations SANS
    # add_header : les durées de cache passent donc par « expires », jamais
    # par add_header. De même, chaque location qui transmet ses propres
    # proxy_set_header doit les lister tous.
    #
    # X-Request-ID : identifiant unique généré par nginx pour chaque requête
    # ($request_id), transmis aux backends (Gunicorn l'écrit dans son journal
    # d'accès) et renvoyé au client. Celui qu'enverrait le client est écrasé.

    # Routes de santé INTERNES (healthchecks compose, depuis les conteneurs) :
    # jamais servies à l'extérieur. Django ne les expose qu'à la racine
    # (/health/), hors des préfixes proxifiés ; sans ces blocs, la requête
    # tomberait dans le frontend.
    location = /health {
        return 404;
    }

    location = /health/ {
        return 404;
    }

    # Préfixe : couvre /fast/health et ses variantes, avant le bloc /fast/.
    location ^~ /fast/health {
        return 404;
    }

    # Frontend (React statique)
    location / {
        set $amont_frontend http://frontend:80;
        proxy_pass $amont_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # $scheme reflète le protocole réellement utilisé par CE bloc serveur
        # (donc "https" ici) — Nginx l'impose lui-même plutôt que de relayer
        # un en-tête venant du client, qui pourrait sinon être forgé par
        # quiconque contournerait Cloudflare pour taper directement l'IP du
        # serveur.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Django : API coeur métier. proxy_pass SANS chemin (variable sans URI) :
    # nginx transmet l'URI d'origine telle quelle (/api/... arrive en
    # /api/..., comme l'attend config/urls.py). Un « / » final remplacerait
    # /api/ par / et toute l'API répondrait 404.
    location /api/ {
        set $amont_django http://backend-django:8000;
        proxy_pass $amont_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Route interne de vérification du jeton (apps/utilisateurs/views.py,
    # VerificationJetonServiceView) : réservée à FastAPI, qui l'appelle
    # directement sur le réseau Docker (http://backend-django:8000/api/...),
    # sans passer par ici. Depuis Internet : 404, sans atteindre Django.
    # Préfixe sans « / » final et ^~ : couvre aussi la variante sans « / »
    # et passe avant toute location regex. nginx compare l'URI normalisée
    # (« // », « ./ », « ../ » et %XX décodés) : ces variantes sont bloquées.
    location ^~ /api/utilisateurs/jeton/verification {
        return 404;
    }

    # Administration Django : fermée par défaut. Le fichier inclus est écrit
    # au démarrage par infra/nginx/entrypoint.d/40-anitche-config.sh, une
    # ligne « allow » par entrée de ADMIN_ALLOWED_CIDRS (vide : aucune) ;
    # tout le reste reçoit 403 de nginx, sans atteindre Django. L'adresse
    # comparée est celle du visiteur après real_ip : CF-Connecting-IP
    # seulement depuis une plage Cloudflare, sinon l'adresse TCP (un client
    # qui contourne Cloudflare ne peut pas se faire passer pour une adresse
    # autorisée). nginx compare l'URI normalisée : //admin/ et %61dmin sont
    # couverts.
    location /admin/ {
        include /etc/nginx/anitche/admin_autorises.conf;
        deny all;

        set $amont_django http://backend-django:8000;
        proxy_pass $amont_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Fichiers statiques de Django (admin), écrits par collectstatic dans le
    # volume anitche_static (STATIC_ROOT=/app/staticfiles), lus ici en
    # lecture seule. Noms sans empreinte (pas de ManifestStaticFilesStorage) :
    # cache court, une mise à jour de Django est visible en un jour au plus.
    location /static/ {
        alias /srv/static/;
        expires 1d;
        access_log off;
    }

    # Médias PUBLICS uniquement (volume anitche_media, lecture seule), un
    # préfixe par champ public (upload_to) :
    #   catalogue/categories/  Categorie.image
    #   catalogue/produits/    ImageProduit.image
    #   boutiques/logos/       Boutique.logo
    #   boutiques/bannieres/   Boutique.banniere
    # Un nouveau champ fichier public doit être ajouté ici ; un champ privé
    # ne doit JAMAIS l'être.
    location ~ ^/media/(?:catalogue/(?:categories|produits)|boutiques/(?:logos|bannieres))/ {
        root /srv;
        expires 7d;
        access_log off;
    }

    # Tout le reste sous /media/ est privé : kyc/ (pièces d'identité,
    # selfies), support/pieces_jointes/, retours/preuves/. Ces fichiers ne
    # sortent que par les vues Django qui contrôlent le propriétaire.
    location /media/ {
        return 404;
    }

    # FastAPI : recherche, IA, QR code, temps réel (WebSocket compris).
    # Le nom du service est résolu à chaque requête (resolver du bloc server) :
    # il passe par une variable. proxy_pass avec une variable ne retire plus
    # le préfixe tout seul, d'où le rewrite explicite (/fast/x arrive en /x ;
    # ROOT_PATH=/fast côté FastAPI) ; la chaîne de requête est conservée.
    # FastAPI absent : 502, sans empêcher nginx de démarrer.
    location /fast/ {
        set $amont_fastapi http://backend-fastapi:8001;
        rewrite ^/fast/(.*)$ /$1 break;
        proxy_pass $amont_fastapi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
