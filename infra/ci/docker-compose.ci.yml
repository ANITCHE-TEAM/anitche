# Surcharge de CI, ajoutée au compose de production :
#   docker compose -f infra/docker-compose.prod.yml -f infra/ci/docker-compose.ci.yml ...
# Jamais lue en production. Elle ne change que trois choses :
#   - nginx lit son certificat dans un dossier de l'hôte (certificat autosigné
#     généré par le job, infra/ci/generer_certificat_ci.sh) au lieu du volume
#     certbot_conf ; le modèle nginx.conf reste celui de la production. Compose
#     fusionne les volumes par chemin cible : ce montage remplace celui de
#     certbot_conf ;
#   - le frontend est une page statique minimale au lieu du build de
#     frontend/Dockerfile.prod (npm ci + build), que ce job ne teste pas ;
#   - la sauvegarde (avant les migrations, infra/scripts/migrer.sh) va dans
#     un dépôt restic local au volume ci_depot_restic au lieu du stockage S3.
# CI_CERT_DIR : chemin absolu du dossier contenant live/<DOMAIN>/.

services:
  nginx:
    volumes:
      - ${CI_CERT_DIR:?CI_CERT_DIR doit désigner le dossier du certificat de test}:/etc/letsencrypt:ro

  frontend:
    build: !reset null
    image: nginx:alpine
    volumes:
      - ./ci/frontend/index.html:/usr/share/nginx/html/index.html:ro

  backup:
    environment:
      RESTIC_REPOSITORY: /depot
    volumes:
      - ci_depot_restic:/depot

volumes:
  ci_depot_restic:
