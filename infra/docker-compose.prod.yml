# Environnement de PRODUCTION.
# Lancer depuis la racine du repo :
#   docker compose -f infra/docker-compose.prod.yml up -d --build
#
# Différences clés avec le dev :
#   - le frontend est buildé en statique, un portail par image (Dockerfile.prod),
#     et servi par un nginx sans root par portail
#   - Nginx route chaque nom de domaine vers son portail et fait office de
#     reverse proxy vers Django (/api/, /admin/) et FastAPI (/fast/), et sert
#     /static/ et les médias publics (/media/)
#   - Django tourne avec Gunicorn, pas le serveur de dev
#   - les secrets viennent d'un fichier .env (jamais commité), pas de valeurs par défaut

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Un portail React : image nginx sans root (port 8080), construite par
# frontend/Dockerfile.prod avec le portail choisi par PORTAIL. Le contrôle
# demande la page d'accueil du portail au nginx de l'image.
x-portail: &portail
  restart: unless-stopped
  logging: *logging
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 10s

# Environnement commun à Django, au worker et à beat : les trois chargent
# config.settings.prod, qui refuse de démarrer si une variable manque. Une
# variable ajoutée ici arrive aux trois services.
x-env-django: &env-django
  DJANGO_SETTINGS_MODULE: config.settings.prod
  SECRET_KEY: ${SECRET_KEY}
  # Clés de chiffrement des données KYC (apps.core.fields), clé active en
  # premier. Sans elles, prod.py refuse de démarrer (Django et Celery).
  FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS}
  # Paiements (apps.paiements) : fournisseur et clés GeniusPay. Sans
  # elles, prod.py refuse de démarrer (Django et Celery). La variable
  # de staging absente vaut « false » ; vide, elle reste vide et prod.py
  # refuse de démarrer (jamais de conversion tolérante).
  PAIEMENT_FOURNISSEUR: ${PAIEMENT_FOURNISSEUR}
  GENIUSPAY_API_KEY: ${GENIUSPAY_API_KEY:-}
  GENIUSPAY_API_SECRET: ${GENIUSPAY_API_SECRET:-}
  GENIUSPAY_WEBHOOK_SECRET: ${GENIUSPAY_WEBHOOK_SECRET:-}
  GENIUSPAY_ENVIRONNEMENT: ${GENIUSPAY_ENVIRONNEMENT:-}
  ANITCHE_STAGING_SANDBOX_PAIEMENT: ${ANITCHE_STAGING_SANDBOX_PAIEMENT-false}
  BACKEND_BASE_URL: ${BACKEND_BASE_URL}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  # Emails (codes OTP, notifications) : serveur SMTP du fournisseur et
  # expéditeur @anitche.com. Sans eux, prod.py refuse de démarrer
  # (Django et Celery).
  EMAIL_BACKEND: ${EMAIL_BACKEND}
  EMAIL_HOST: ${EMAIL_HOST}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
  EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
  # URL de vérification des passeports QR (apps.passeport_qr).
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://${DOMAIN}}
  DB_NAME: ${DB_NAME}
  # Rôle applicatif, ni superutilisateur ni CREATEDB/CREATEROLE, propriétaire
  # de la base (infra/scripts/create_app_role.sh, lancé avant les
  # migrations). Le superutilisateur ne sert qu'aux scripts d'infra/scripts/.
  DB_USER: anitche_app
  DB_PASSWORD: ${DB_PASSWORD}
  DB_HOST: db
  DB_PORT: 5432
  # Base 0 : Celery (broker et résultats) ; base 1 : cache Django. Le mot de
  # passe de Redis (lettres et chiffres, check_prod_env.sh) est inséré tel
  # quel dans l'URL ; prod.py refuse une URL sans lui.
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  # Nombre de workers Gunicorn (backend-django/gunicorn.conf.py) ; seul
  # backend-django le lit, il reste ici pour garder les trois environnements
  # identiques.
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${DB_NAME}
      # Superutilisateur : initialisation de la base, rôles (create_app_role.sh,
      # create_fastapi_readonly_role.sh) et sauvegardes. Ni Django, ni Celery,
      # ni FastAPI ne le reçoivent.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD}
    volumes:
      - anitche_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # requirepass dans un fichier de configuration monté (configs, en fin de
    # fichier) : le mot de passe n'apparaît ni dans la commande ni dans
    # « docker inspect ». Le healthcheck s'authentifie par REDISCLI_AUTH.
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    configs:
      - source: redis_conf
        target: /usr/local/etc/redis/redis.conf
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-django:
    build:
      context: ../backend-django
    restart: unless-stopped
    logging: *logging
    # Jamais de migrate ici : les migrations ne passent que par
    # infra/scripts/migrer.sh (deploy.sh), qui sauvegarde la base avant. Un
    # redémarrage ou un « up -d » manuel ne migre donc jamais.
    command: sh -c "python manage.py collectstatic --noinput && gunicorn config.wsgi:application -c gunicorn.conf.py"
    environment: *env-django
    volumes:
      # MEDIA_ROOT (config/settings/base.py) = BASE_DIR/media = /app/media
      # dans ce conteneur (WORKDIR /app, voir Dockerfile). Sans volume
      # nommé, tout fichier uploadé est perdu au prochain rebuild/redeploy.
      # Les fichiers privés (KYC, pièces jointes du support, photos des
      # retours) ne sont servis que par les vues Django protégées ; nginx
      # monte ce volume en lecture seule et n'en sert que les dossiers
      # publics (images des produits et catégories, logos et bannières des
      # boutiques) : voir infra/nginx/serveur-commun.conf.
      - anitche_media:/app/media
      # STATIC_ROOT = /app/staticfiles : collectstatic y écrit au démarrage,
      # nginx le sert sous /static/ (lecture seule).
      - anitche_static:/app/staticfiles
    # /health/ (apps/core/sante.py) : base et Redis, appelé en HTTP sur
    # 127.0.0.1 avec le nom de service comme Host (présent dans
    # ALLOWED_HOSTS). start_period couvre collectstatic, lancé par la
    # commande avant Gunicorn.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host': 'backend-django'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ../backend-django
    restart: unless-stopped
    logging: *logging
    command: celery -A config worker -l info
    environment: *env-django
    # Ping du worker lui-même (-d celery@<hostname>) : il prouve que le worker
    # joint le broker et répond, pas seulement que le processus existe.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ../backend-django
    restart: unless-stopped
    logging: *logging
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment: *env-django
    # Beat n'a ni port ni commande d'inspection : le contrôle vérifie que son
    # processus (PID 1 du conteneur) tourne toujours. Un beat bloqué sans
    # sortir n'est pas détecté.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if b'beat' in open('/proc/1/cmdline', 'rb').read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-fastapi:
    build:
      context: ../backend-fastapi
    restart: unless-stopped
    logging: *logging
    # --no-proxy-headers : l'IP du client est lue par app/core/network.py
    # (TRUSTED_PROXY_COUNT). --no-access-log : journal d'accès de l'app, sans
    # chaîne de requête. Plusieurs workers : aucun état en mémoire (Redis).
    # --ws-* : messages WebSocket de 8 Kio au plus, ping toutes les 20 s.
    command: uvicorn --factory app.main:create_app --host 0.0.0.0 --port 8001 --workers 2 --no-proxy-headers --no-access-log --ws-max-size 8192 --ws-ping-interval 20 --ws-ping-timeout 20
    environment:
      # ENVIRONMENT=prod : doc coupée, et refus de démarrer si un réglage
      # ci-dessous est absent ou dangereux (app/core/settings.py).
      ENVIRONMENT: prod
      # Appel interne direct, sans nginx ni TLS (ALLOWED_HOSTS contient
      # backend-django, SECURE_REDIRECT_EXEMPT côté Django).
      DJANGO_API_BASE_URL: http://backend-django:8000/api
      # Rôle en lecture seule, jamais DB_USER. FASTAPI_DB_PASSWORD est inséré
      # tel quel dans l'URL : caractères alphanumériques uniquement.
      DATABASE_URL: postgresql://anitche_fastapi_ro:${FASTAPI_DB_PASSWORD}@db:5432/${DB_NAME}
      # Base 2 réservée à FastAPI (0 : Celery, 1 : cache Django), même mot de
      # passe que Django.
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://${DOMAIN}}
      # Un seul proxy de confiance : nginx (comme NUM_PROXIES = 1 côté Django).
      TRUSTED_PROXY_COUNT: 1
      ROOT_PATH: /fast
      # Recherche, sans valeur par défaut : absentes ou pas en https://, le
      # service refuse de démarrer (app/core/settings.py). Adresse publique
      # de FastAPI, préfixe /fast compris (liens next/previous), et adresse
      # publique des fichiers média de Django (images des produits).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-django:
        condition: service_started

  frontend-client:
    <<: *portail
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        PORTAIL: client

  frontend-vendeur:
    <<: *portail
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        PORTAIL: vendeur

  frontend-livreur:
    <<: *portail
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        PORTAIL: livreur

  frontend-admin:
    <<: *portail
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        PORTAIL: admin

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    # Domaines et accès à /admin/ (docs/DEPLOIEMENT.md). nginx.conf est un
    # modèle (serveur-commun.conf et proxy-en-tetes.conf, lus tels quels) : l'image le rend au démarrage avec les seules variables de
    # NGINX_ENVSUBST_FILTER (« $$ » : un « $ » littéral pour compose).
    # 40-anitche-config.sh refuse de démarrer sur un nom ou une adresse
    # invalide ; 50-anitche-rechargement.sh recharge nginx périodiquement
    # pour servir le certificat renouvelé par certbot.
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN doit être défini dans infra/.env (ex. anitche.com)}
      DOMAIN_VENDEUR: ${DOMAIN_VENDEUR:-vendeur.${DOMAIN}}
      DOMAIN_LIVREUR: ${DOMAIN_LIVREUR:-livreur.${DOMAIN}}
      DOMAIN_ADMIN: ${DOMAIN_ADMIN:-admin.${DOMAIN}}
      # Vide (par défaut) : /admin/ répond 403 à tous.
      ADMIN_ALLOWED_CIDRS: ${ADMIN_ALLOWED_CIDRS:-}
      NGINX_RELOAD_INTERVAL: ${NGINX_RELOAD_INTERVAL:-6h}
      NGINX_ENVSUBST_FILTER: ^(DOMAIN|DOMAIN_VENDEUR|DOMAIN_LIVREUR|DOMAIN_ADMIN)$$
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/serveur-commun.conf:/etc/nginx/anitche/serveur-commun.conf:ro
      - ./nginx/proxy-en-tetes.conf:/etc/nginx/anitche/proxy-en-tetes.conf:ro
      - ./nginx/entrypoint.d/40-anitche-config.sh:/docker-entrypoint.d/40-anitche-config.sh:ro
      - ./nginx/entrypoint.d/50-anitche-rechargement.sh:/docker-entrypoint.d/50-anitche-rechargement.sh:ro
      # Certificats émis/renouvelés par le service "certbot"
      # ci-dessous, partagés en lecture avec Nginx via ce volume commun.
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      # /static/ et médias publics sous /media/ (infra/nginx/*.conf),
      # en lecture seule : nginx ne peut ni modifier ni ajouter un fichier.
      - anitche_static:/srv/static:ro
      - anitche_media:/srv/media:ro
    # /nginx-health : serveur sur 127.0.0.1:8081 du conteneur (nginx.conf).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - frontend-client
      - frontend-vendeur
      - frontend-livreur
      - frontend-admin
      - backend-django
      - backend-fastapi

  # Renouvelle automatiquement le certificat Let's Encrypt toutes les
  # 12h (certbot n'agit que si le certificat approche de son expiration —
  # à 30 jours de l'échéance par défaut) ; nginx le sert au rechargement
  # périodique suivant (NGINX_RELOAD_INTERVAL). L'émission INITIALE du certificat
  # ne passe pas par ce service : voir infra/scripts/init-lets-encrypt.sh,
  # à lancer une seule fois avant le tout premier démarrage de Nginx en 443.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    logging: *logging
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

  # Sauvegarde chiffrée hors serveur de la base et des médias, et
  # restauration (restic, dépôt S3 ; docs/SAUVEGARDES.md). Profil « backup » :
  # jamais démarré par « up -d ». Conteneur à usage unique (run --rm) lancé
  # par infra/scripts/backup.sh (cron, chaque nuit) et
  # infra/scripts/restore.sh. Reçoit seulement les variables de la base et
  # de la sauvegarde : ni SECRET_KEY, ni FIELD_ENCRYPTION_KEYS, ni les clés
  # GeniusPay ; aucun autre service ne reçoit les variables BACKUP_*.
  backup:
    build:
      context: ./backup
    profiles: ["backup"]
    logging: *logging
    environment:
      RESTIC_REPOSITORY: ${BACKUP_REPOSITORY}
      RESTIC_PASSWORD: ${BACKUP_PASSWORD}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY}
      # Vide : aucune région (même effet qu'une variable absente pour restic).
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-}
      RESTIC_CACHE_DIR: /cache
      PGHOST: db
      DB_NAME: ${DB_NAME}
      # Superutilisateur : pg_dump lit tout, la restauration crée la base
      # cible (propriétaire et objets : anitche_app, infra/backup/entrypoint.sh).
      DB_USER: postgres
      PGPASSWORD: ${DB_SUPERUSER_PASSWORD}
    volumes:
      # Lecture seule : la sauvegarde ne modifie jamais les médias.
      - anitche_media:/sauvegarde/media:ro
      # Cache de restic (index et métadonnées du dépôt, chiffrés comme
      # lui) : évite de les retélécharger chaque nuit.
      - anitche_backup_cache:/cache

# Configuration de Redis, montée en lecture seule dans le conteneur redis.
configs:
  redis_conf:
    content: |
      requirepass ${REDIS_PASSWORD}

volumes:
  anitche_pgdata:
  anitche_media:
  anitche_static:
  certbot_conf:
  certbot_www:
  anitche_backup_cache: