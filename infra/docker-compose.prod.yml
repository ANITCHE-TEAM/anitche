version: "3.9"

# Environnement de PRODUCTION.
# Lancer depuis la racine du repo :
#   docker compose -f infra/docker-compose.prod.yml up -d --build
#
# Différences clés avec le dev :
#   - le frontend est buildé en statique (Dockerfile.prod) et servi par Nginx
#   - Nginx fait aussi office de reverse proxy vers Django (/api/) et FastAPI (/fast/)
#   - Django tourne avec Gunicorn, pas le serveur de dev
#   - les secrets viennent d'un fichier .env (jamais commité), pas de valeurs par défaut

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - anitche_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-django:
    build:
      context: ../backend-django
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY}
      # Clés de chiffrement des données KYC (apps.core.fields), clé active en
      # premier. Sans elles, prod.py refuse de démarrer (Django et Celery).
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS}
      # Paiements (apps.paiements) : fournisseur et clés CinetPay. Sans
      # elles, prod.py refuse de démarrer (Django et Celery).
      PAIEMENT_FOURNISSEUR: ${PAIEMENT_FOURNISSEUR}
      CINETPAY_API_KEY: ${CINETPAY_API_KEY}
      CINETPAY_API_PASSWORD: ${CINETPAY_API_PASSWORD}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # URL de vérification des passeports QR (apps.passeport_qr).
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://anitche.com}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    volumes:
      # MEDIA_ROOT (config/settings/base.py) = BASE_DIR/media = /app/media
      # dans ce conteneur (WORKDIR /app, voir Dockerfile). Sans volume
      # nommé, tout fichier KYC uploadé (recto/verso/selfie) est perdu au
      # prochain rebuild/redeploy — seul backend-django sert ces fichiers
      # (TelechargerDocumentKYCView), pas besoin de le monter ailleurs.
      - anitche_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ../backend-django
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY}
      # Clés de chiffrement des données KYC (apps.core.fields), clé active en
      # premier. Sans elles, prod.py refuse de démarrer (Django et Celery).
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS}
      # Paiements (apps.paiements) : fournisseur et clés CinetPay. Sans
      # elles, prod.py refuse de démarrer (Django et Celery).
      PAIEMENT_FOURNISSEUR: ${PAIEMENT_FOURNISSEUR}
      CINETPAY_API_KEY: ${CINETPAY_API_KEY}
      CINETPAY_API_PASSWORD: ${CINETPAY_API_PASSWORD}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ../backend-django
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY}
      # Clés de chiffrement des données KYC (apps.core.fields), clé active en
      # premier. Sans elles, prod.py refuse de démarrer (Django et Celery).
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS}
      # Paiements (apps.paiements) : fournisseur et clés CinetPay. Sans
      # elles, prod.py refuse de démarrer (Django et Celery).
      PAIEMENT_FOURNISSEUR: ${PAIEMENT_FOURNISSEUR}
      CINETPAY_API_KEY: ${CINETPAY_API_KEY}
      CINETPAY_API_PASSWORD: ${CINETPAY_API_PASSWORD}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-fastapi:
    build:
      context: ../backend-fastapi
    restart: unless-stopped
    # --no-proxy-headers : l'IP du client est lue par app/core/network.py
    # (TRUSTED_PROXY_COUNT). --no-access-log : journal d'accès de l'app, sans
    # chaîne de requête. Plusieurs workers : aucun état en mémoire (Redis).
    # --ws-* : messages WebSocket de 8 Kio au plus, ping toutes les 20 s.
    command: uvicorn --factory app.main:create_app --host 0.0.0.0 --port 8001 --workers 2 --no-proxy-headers --no-access-log --ws-max-size 8192 --ws-ping-interval 20 --ws-ping-timeout 20
    environment:
      # ENVIRONMENT=prod : doc coupée, et refus de démarrer si un réglage
      # ci-dessous est absent ou dangereux (app/core/settings.py).
      ENVIRONMENT: prod
      # Appel interne direct, sans nginx ni TLS (ALLOWED_HOSTS contient
      # backend-django, SECURE_REDIRECT_EXEMPT côté Django).
      DJANGO_API_BASE_URL: http://backend-django:8000/api
      # Rôle en lecture seule, jamais DB_USER. FASTAPI_DB_PASSWORD est inséré
      # tel quel dans l'URL : caractères alphanumériques uniquement.
      DATABASE_URL: postgresql://anitche_fastapi_ro:${FASTAPI_DB_PASSWORD}@db:5432/${DB_NAME}
      # Base 2 réservée à FastAPI (0 : Celery, 1 : cache Django).
      REDIS_URL: redis://redis:6379/2
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://anitche.com}
      # Un seul proxy de confiance : nginx (comme NUM_PROXIES = 1 côté Django).
      TRUSTED_PROXY_COUNT: 1
      ROOT_PATH: /fast
      # Recherche, sans valeur par défaut : absentes ou pas en https://, le
      # service refuse de démarrer (app/core/settings.py). Adresse publique
      # de FastAPI, préfixe /fast compris (liens next/previous), et adresse
      # publique des fichiers média de Django (images des produits).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-django:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # F-18 : certificats émis/renouvelés par le service "certbot"
      # ci-dessous, partagés en lecture avec Nginx via ce volume commun.
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend-django
      - backend-fastapi

  # F-18 : renouvelle automatiquement le certificat Let's Encrypt toutes les
  # 12h (certbot n'agit que si le certificat approche de son expiration —
  # à 30 jours de l'échéance par défaut). L'émission INITIALE du certificat
  # ne passe pas par ce service : voir infra/scripts/init-lets-encrypt.sh,
  # à lancer une seule fois avant le tout premier démarrage de Nginx en 443.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

volumes:
  anitche_pgdata:
  anitche_media:
  certbot_conf:
  certbot_www: