version: "3.9"

# Environnement de DÉVELOPPEMENT local.
# Lancer depuis la racine du repo : docker compose -f infra/docker-compose.yml up
#
# Accès une fois lancé :
#   Frontend  -> http://localhost:5173
#   Django    -> http://localhost:8000
#   FastAPI   -> http://localhost:8001/docs (Swagger auto-généré)
#   Mailpit   -> http://localhost:8025 (emails envoyés en dev : codes OTP,
#                notifications ; aucun email ne sort vers l'extérieur)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-anitche}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - anitche_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-django:
    container_name: anitche-backend
    build:
      context: ../backend-django
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DB_NAME: ${DB_NAME:-anitche}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      # Emails de dev capturés par Mailpit (config/settings/dev.py).
      EMAIL_HOST: mailpit
    volumes:
      - ../backend-django:/app
    ports:
      - "8000:8000"
    networks:
      - default
      - anitche-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
  celery-worker:
    build:
      context: ../backend-django
    command: celery -A config worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_NAME: ${DB_NAME:-anitche}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      # Emails de dev capturés par Mailpit (config/settings/dev.py).
      EMAIL_HOST: mailpit
    volumes:
      - ../backend-django:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  celery-beat:
    build:
      context: ../backend-django
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_NAME: ${DB_NAME:-anitche}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      # Emails de dev capturés par Mailpit (config/settings/dev.py).
      EMAIL_HOST: mailpit
    volumes:
      - ../backend-django:/app
    networks:
      - default
      - anitche-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Capture des emails de DEV uniquement (jamais en production) : SMTP sur
  # 1025, interface web et API sur 8025. Les collections Postman lisent les
  # codes OTP via son API (GET /api/v1/search).
  mailpit:
    image: axllent/mailpit:v1.20.0
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  backend-fastapi:
    build:
      context: ../backend-fastapi
    # --reload : dev uniquement. --no-proxy-headers : l'IP du client est lue
    # par app/core/network.py. --no-access-log : journal d'accès de l'app,
    # sans chaîne de requête (jetons WebSocket). --ws-* : messages WebSocket
    # de 8 Kio au plus (l'app en refuse au-delà de 4 Kio), ping toutes les
    # 20 s (tient la connexion derrière nginx et Cloudflare).
    command: uvicorn --factory app.main:create_app --host 0.0.0.0 --port 8001 --reload --no-proxy-headers --no-access-log --ws-max-size 8192 --ws-ping-interval 20 --ws-ping-timeout 20
    environment:
      ENVIRONMENT: dev
      # Nom d'hôte accepté par Django en dev (ALLOWED_HOSTS de dev.py).
      DJANGO_API_BASE_URL: http://anitche-backend:8000/api
      # Rôle PostgreSQL en lecture seule (infra/postgres/fastapi_readonly.sql),
      # jamais le superutilisateur. Mot de passe de dev par défaut.
      DATABASE_URL: postgresql://anitche_fastapi_ro:${FASTAPI_DB_PASSWORD:-fastapi_ro_dev}@db:5432/${DB_NAME:-anitche}
      # Base 2 réservée à FastAPI (0 : Celery, 1 : cache Django).
      REDIS_URL: redis://redis:6379/2
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      FRONTEND_BASE_URL: http://localhost:5173
      # Recherche : liens next/previous (adresse publique de FastAPI) et URL
      # des images (fichiers média servis par Django en dev).
      PUBLIC_BASE_URL: http://localhost:8001
      MEDIA_BASE_URL: http://localhost:8000/media/
    volumes:
      - ../backend-fastapi:/app
    ports:
      - "8001:8001"
    healthcheck:
      # Pas de curl dans l'image slim. /health répond 503 si PostgreSQL ou
      # Redis ne répond pas : urlopen échoue alors.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-django:
        condition: service_started

  frontend:
    build:
      context: ../frontend
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_FASTAPI_URL: http://localhost:8001
    depends_on:
      - backend-django
      - backend-fastapi

volumes:
  anitche_pgdata:

networks:
  anitche-net:
    external: true