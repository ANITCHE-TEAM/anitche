      summary: Rechercher des produits
      parameters:
      - in: query
        name: boutique
        schema:
          type: string
        description: Slug ou identifiant de la boutique.
      - in: query
        name: categorie
        schema:
          type: string
        description: Slug ou identifiant ; inclut les sous-catégories.
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: prix_max
        schema:
          type: integer
        description: FCFA.
      - in: query
        name: prix_min
        schema:
          type: integer
        description: FCFA.
      - in: query
        name: recherche
        schema:
          type: string
        description: Nom, description ou nom de boutique (100 caractères au plus).
      - in: query
        name: tri
        schema:
          type: string
          enum:
          - date_asc
          - date_desc
          - prix_asc
          - prix_desc
        description: 'Défaut : plus récents d''abord.'
