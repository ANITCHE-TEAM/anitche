components:
  schemas:
    AbandonnerLivraisonRequest:
      type: object
      properties:
        commentaire:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - commentaire
    ActionEnum:
      enum:
      - approuver
      - rejeter
      - en_transit
      - receptionner
      - rembourser
      - cloturer
      - annuler
      type: string
      description: |-
        * `approuver` - approuver
        * `rejeter` - rejeter
        * `en_transit` - en_transit
        * `receptionner` - receptionner
        * `rembourser` - rembourser
        * `cloturer` - cloturer
        * `annuler` - annuler
    AdresseLivraisonLecture:
      type: object
      description: |-
        Adresse de livraison telle que renvoyée (schéma OpenAPI) : celle du
        checkout, avec la zone tarifaire déduite de la commune.
      properties:
        zone:
          type: string
        commune:
          type: string
        quartier:
          type: string
        point_de_repere:
          type: string
        telephone:
          type: string
      required:
      - commune
      - point_de_repere
      - quartier
      - telephone
      - zone
    AdresseLivraisonRequest:
      type: object
      description: |-
        Adresse saisie à la validation du panier, obligatoire.

        Structurée pour la Côte d'Ivoire : commune, quartier et point de repère
        (les adresses postales y sont rares, le livreur se guide aux repères),
        plus un téléphone joignable pour cette livraison, choisi par le client
        (visible par le vendeur et le livreur). La commune fixe le tarif de
        livraison. La zone n'est jamais demandée au client : le serveur la
        déduit de la commune (apps.livraison.frais) ; un champ `zone` envoyé est
        ignoré, sinon un client paierait le tarif d'Abidjan pour l'intérieur.
      properties:
        commune:
          type: string
          minLength: 1
          maxLength: 100
        quartier:
          type: string
          minLength: 1
          maxLength: 150
        point_de_repere:
          type: string
          minLength: 1
          maxLength: 500
        telephone:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - commune
      - point_de_repere
      - quartier
      - telephone
    ArticleRetourInputRequest:
      type: object
      properties:
        commande_item_id:
          type: string
          format: uuid
        quantite:
          type: integer
          minimum: 1
      required:
      - commande_item_id
      - quantite
    ArticleVendeur:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        variante:
          type: integer
          readOnly: true
        nom_produit:
          type: string
          readOnly: true
        prix_unitaire:
          type: string
          format: decimal
          pattern: ^\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          example: '15000.00'
        quantite:
          type: integer
          readOnly: true
      required:
      - id
      - nom_produit
      - prix_unitaire
      - quantite
      - variante
    AssignationTicketRequestRequest:
      type: object
      properties:
        assigned_to:
          type: integer
          description: Identifiant de l'agent (administration).
    AssignerLivreurRequest:
      type: object
      properties:
        livreur_id:
          type: integer
        date_livraison_estimee:
          type: string
          format: date
      required:
      - livreur_id
    AuthorRoleEnum:
      enum:
      - client
      - vendor
      - support
      type: string
      description: |-
        * `client` - Client
        * `vendor` - Vendeur
        * `support` - Support ANITCHE
    BaremeFrais:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        boutique:
          type:
          - integer
          - 'null'
        libelle:
          type: string
          maxLength: 100
        taux_commission:
          type: string
          format: decimal
          pattern: ^\d{0,3}(?:\.\d{0,2})?$
          description: Commission en % du prix de vente (avant remise).
          example: '10.00'
        frais_fixe_article:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: FCFA par article vendu.
        date_debut:
          type: string
          format: date-time
        date_fin:
          type:
          - string
          - 'null'
          format: date-time
        cree_par:
          type:
          - integer
          - 'null'
          readOnly: true
        date_creation:
          type: string
          format: date-time
          readOnly: true
      required:
      - cree_par
      - date_creation
      - frais_fixe_article
      - id
      - taux_commission
    BaremeFraisRequest:
      type: object
      properties:
        boutique:
          type:
          - integer
          - 'null'
        libelle:
          type: string
          maxLength: 100
        taux_commission:
          type: string
          format: decimal
          pattern: ^\d{0,3}(?:\.\d{0,2})?$
          description: Commission en % du prix de vente (avant remise).
          example: '10.00'
        frais_fixe_article:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: FCFA par article vendu.
        date_debut:
          type: string
          format: date-time
        date_fin:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - frais_fixe_article
      - taux_commission
    Boutique:
      type: object
      description: |-
        Boutique vue par son propriétaire (création et mise à jour).

        `est_active` = fermeture volontaire, modifiable par le vendeur.
        `est_suspendue` = décision de l'administration : visible mais en lecture
        seule ici, pour qu'un vendeur suspendu ne puisse pas la lever.
      properties:
        id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 120
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        logo:
          type:
          - string
          - 'null'
          format: uri
        banniere:
          type:
          - string
          - 'null'
          format: uri
        telephone_contact:
          type: string
          maxLength: 20
        email_contact:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        adresse:
          type: string
        ville:
          type: string
          maxLength: 100
        est_active:
          type: boolean
          description: Fermeture volontaire par le vendeur (la boutique disparaît
            du catalogue public).
        est_suspendue:
          type: boolean
          readOnly: true
          description: 'Suspension par l''administration : la boutique disparaît du
            catalogue public et le vendeur ne peut pas la lever lui-même.'
        est_publiable:
          type: boolean
          readOnly: true
        livraison_offerte:
          type: boolean
          description: 'Livraison offerte au client : les frais sont déduits du reversement
            du vendeur.'
        proprietaire_email:
          type: string
