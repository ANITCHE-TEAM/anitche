      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
        reponse:
          type: string
          default: ''
          maxLength: 2000
        restock:
          type: boolean
          default: true
    PatchedVarianteProduitRequest:
      type: object
      description: Variante vue et modifiée par son vendeur (stock complet).
      properties:
        nom:
          type: string
          minLength: 1
          description: 'Ex : Taille M / Rouge, ou Modèle standard'
          maxLength: 150
        prix:
          type: string
          format: decimal
          pattern: ^\d{0,10}(?:\.\d{0,2})?$
          description: Prix de vente standard en FCFA
          example: '15000.00'
        prix_promo:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^\d{0,10}(?:\.\d{0,2})?$
          description: Prix promotionnel optionnel en FCFA
          example: '12500.00'
        poids_kg:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^\d{0,4}(?:\.\d{0,2})?$
          description: Poids unitaire en kg (utile pour le calcul des frais de livraison)
          example: '1.50'
