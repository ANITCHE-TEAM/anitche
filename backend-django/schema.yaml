tags:
- name: Utilisateurs
  description: Inscription, connexion JWT (et Google), profil, codes OTP (email),
    mot de passe oublié, dépôt et lecture du dossier KYC.
- name: Vendeurs
  description: Boutiques publiques, boutique du vendeur connecté, décisions sur les
    demandes vendeur et suspension des boutiques (administration).
- name: Catalogue
  description: 'Catégories et produits publics ; espace vendeur : produits, variantes,
    stock et images ; modération (administration).'
- name: Panier
  description: 'Panier du client connecté ou anonyme (cookie de session) : articles,
    quantités, disponibilité.'
- name: Commandes
  description: Simulation et validation du checkout (une commande par boutique), suivi,
    annulation ; espace vendeur ; annulation par l'administration.
- name: Paiements
  description: Paiement en ligne (mobile money, carte), annulation d'un paiement en
    attente ; reversements vendeur ; remboursements, reversements et barèmes de frais
    (administration). Les notifications des fournisseurs (webhooks) ne figurent pas
    ici.
- name: Livraison
  description: Tarifs par commune, suivi selon le rôle (client, livreur, vendeur,
    administration), code de livraison, contestation, assignation et gestion des livreurs.
- name: Retours
  description: Demandes de retour (commande livrée, 7 jours), photos justificatives,
    traitement par la boutique ou l'administration.
- name: Fidélité
  description: Compte de points, gains en attente, transactions, conversion de points
    en coupon, vérification d'un code promo.
- name: Notifications
  description: Notifications de l'utilisateur connecté, compteur de non lues, préférences
    d'envoi par email.
- name: Support
  description: Tickets, messages, pièces jointes et notation ; file et assignation
    pour l'équipe support.
- name: Passeports QR
  description: 'Passeports d''authenticité : vérification publique d''un QR, gestion
    par le vendeur.'
