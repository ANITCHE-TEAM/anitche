        de pièce — obligatoire pour les pièces recto/verso (CNI, permis,
        carte consulaire, carte résident), refusée pour les pièces à page
        unique (passeport, attestation d'identité).
      properties:
        type_piece:
          $ref: '#/components/schemas/TypePieceEnum'
        numero_mobile_money:
          type: string
          maxLength: 20
        adresse:
          type: string
      required:
      - adresse
      - numero_mobile_money
      - type_piece
    DocumentKYCRequest:
      type: object
      description: |-
        Création d'un dossier de vérification d'identité.

        Règle métier (voir validate()) : la présence du verso dépend du type
        de pièce — obligatoire pour les pièces recto/verso (CNI, permis,
        carte consulaire, carte résident), refusée pour les pièces à page
        unique (passeport, attestation d'identité).
      properties:
        type_piece:
          $ref: '#/components/schemas/TypePieceEnum'
        piece_identite_recto:
          type: string
          format: binary
          writeOnly: true
        piece_identite_verso:
          type:
          - string
          - 'null'
          format: binary
          writeOnly: true
        selfie:
          type: string
          format: binary
          writeOnly: true
