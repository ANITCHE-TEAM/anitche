    SupportTicket:
      type: object
      description: |-
        Ticket de support. Le contenu original (subject/description/order/
        product) est immuable après création : le client corrige ou précise via
        un nouveau message (TicketMessage), jamais en réécrivant la réclamation
        initiale. category/priority restent modifiables, mais uniquement par le
        staff (voir SupportRetrieveUpdateView.perform_update).

        `order` : une commande du demandeur ; `product` : un produit qu'il a
        acheté (dans cette commande si elle est donnée). `vendor` est déduit
        côté serveur (voir SupportTicketListCreateView.perform_create).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        ticket_number:
          type: string
          readOnly: true
        subject:
          type: string
          maxLength: 255
        description:
          type: string
        category:
          $ref: '#/components/schemas/CategoryEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/StatutTicketEnum'
          readOnly: true
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        created_by:
          type: integer
          readOnly: true
        assigned_to:
          type:
          - integer
          - 'null'
          readOnly: true
        vendor:
          type:
          - integer
          - 'null'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        order:
          type:
          - string
          - 'null'
          format: uuid
        product:
          type:
          - integer
          - 'null'
        satisfaction_rating:
          type:
          - integer
          - 'null'
          readOnly: true
      required:
      - assigned_to
      - category
      - created_at
      - created_by
      - description
      - id
      - satisfaction_rating
      - status
      - subject
      - ticket_number
      - updated_at
      - vendor
    SupportTicketRequest:
      type: object
      description: |-
