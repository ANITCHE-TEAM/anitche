          type: string
          maxLength: 100
        est_active:
          type: boolean
          description: Fermeture volontaire par le vendeur (la boutique disparaît
            du catalogue public).
        livraison_offerte:
          type: boolean
          description: 'Livraison offerte au client : les frais sont déduits du reversement
            du vendeur.'
