      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inscription'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Requête invalide (erreurs par champ dans `errors`) ou refus
            métier (message dans `detail`).
        '429':
          content:
