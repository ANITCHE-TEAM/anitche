    Livreur:
      type: object
      description: Livreur vu par l'administration (choix pour l'assignation).
      properties:
        id:
          type: integer
        prenom:
          type: string
        nom:
          type: string
        email:
          type: string
          format: email
        telephone:
          type:
          - string
          - 'null'
        livraisons_en_cours:
          type: integer
          default: 0
      required:
      - email
      - id
      - nom
      - prenom
      - telephone
    LivreurRetire:
      type: object
      properties:
        id:
          type: integer
        prenom:
          type: string
        nom:
          type: string
        role:
          type: string
      required:
      - id
      - nom
      - prenom
      - role
    LivreurVuParLAdministration:
      type: object
      properties:
        id:
          type: integer
        prenom:
          type: string
        nom:
          type: string
      required:
      - id
      - nom
      - prenom
    LivreurVuParLaBoutique:
      type: object
      properties:
        prenom:
          type: string
      required:
      - prenom
    LivreurVuParLeClient:
      type: object
      properties:
        prenom:
          type: string
        telephone:
          type:
          - string
          - 'null'
          description: Seulement pendant « en cours ».
      required:
      - prenom
      - telephone
    Message:
      type: object
      description: Réponse de succès réduite à un message affichable.
      properties:
        message:
          type: string
      required:
      - message
    MethodeEnum:
      enum:
      - wave
      - orange_money
      - mtn_money
      - moov_money
      - carte_bancaire
      type: string
      description: |-
        * `wave` - Wave
        * `orange_money` - Orange Money
        * `mtn_money` - MTN Mobile Money
        * `moov_money` - Moov Money
        * `carte_bancaire` - Carte Bancaire (Visa / Mastercard)
    MotifAnnulationEnum:
      enum:
      - client
      - expiration
      - administration
      - boutique_indisponible
      - livraison_echouee
      type: string
      description: |-
        * `client` - Annulée par le client
        * `expiration` - Non payée dans le délai
        * `administration` - Annulée par l'administration
        * `boutique_indisponible` - Boutique indisponible
        * `livraison_echouee` - Livraison échouée
    MotifRemboursementEnum:
      enum:
      - commande_annulee
      - paiement_en_double
      - retour
      - livraison_non_recue
      type: string
      description: |-
        * `commande_annulee` - Commande annulée après paiement
        * `paiement_en_double` - Commande déjà payée par un autre paiement
        * `retour` - Retour remboursé
        * `livraison_non_recue` - Livraison contestée (colis non reçu)
    MotifRetourEnum:
      enum:
      - produit_defectueux
      - non_conforme
      - mauvaise_taille
      - article_manquant
      - changement_avis
      - autre
      type: string
      description: |-
        * `produit_defectueux` - Produit défectueux ou endommagé
        * `non_conforme` - Article non conforme à la description
        * `mauvaise_taille` - Taille ou variante incorrecte
        * `article_manquant` - Article manquant dans le colis
        * `changement_avis` - Changement d'avis (droit de rétractation)
        * `autre` - Autre motif
    NommerLivreurRequest:
      type: object
      properties:
        utilisateur_id:
          type: integer
      required:
      - utilisateur_id
