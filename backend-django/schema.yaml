openapi: 3.1.0
info:
  title: API ANITCHE
  version: 1.0.0
  description: |-
    API REST du backend Django d'ANITCHE (marketplace, Abidjan, montants en FCFA entiers).

    **Authentification** : JWT. `POST /api/utilisateurs/connexion/` renvoie `access` (15 minutes) et `refresh` (7 jours, à usage unique : `POST /api/utilisateurs/connexion/rafraichir/` en renvoie un nouveau). Envoyer `Authorization: Bearer <access>` (bouton Authorize).

    **Erreurs** : format commun `{success, status_code, detail, errors}` (composant `Erreur`), `errors` étant un objet clé → liste de messages.

    **Pagination** : les listes paginées renvoient `{count, next, previous, results}` (20 éléments par page, paramètre `page`).

    Guide complet : docs/GUIDE_FRONTEND.md.
paths:
  /api/catalogue/administration/produits/{id}/:
    get:
      operationId: catalogue_administration_produits_retrieve
      description: 'Modération d''un produit : désactivation / réactivation uniquement.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Catalogue
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProduitAdministration'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Authentification absente, jeton invalide ou expiré.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Action non autorisée pour ce compte.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Ressource introuvable ou non visible pour ce compte.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: 'Limite de débit atteinte : réessayer après le délai indiqué
            par l''en-tête Retry-After.'
    put:
      operationId: catalogue_administration_produits_update
      description: 'Modération d''un produit : désactivation / réactivation uniquement.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Catalogue
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProduitAdministrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProduitAdministrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProduitAdministrationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProduitAdministration'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Requête invalide (erreurs par champ dans `errors`) ou refus
            métier (message dans `detail`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Authentification absente, jeton invalide ou expiré.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Action non autorisée pour ce compte.
        '404':
