        type_piece:
          allOf:
          - $ref: '#/components/schemas/TypePieceEnum'
          readOnly: true
        piece_identite_recto_url:
          type:
          - string
          - 'null'
          readOnly: true
        piece_identite_verso_url:
          type:
          - string
          - 'null'
          readOnly: true
        selfie_url:
          type:
          - string
          - 'null'
          readOnly: true
        numero_mobile_money:
          type: string
          readOnly: true
        adresse:
          type: string
          readOnly: true
        date_soumission:
          type: string
          format: date-time
          readOnly: true
        date_traitement:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        commentaire_admin:
          type:
          - string
          - 'null'
          readOnly: true
      required:
      - adresse
      - commentaire_admin
      - date_soumission
      - date_traitement
