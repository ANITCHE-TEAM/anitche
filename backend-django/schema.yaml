          type: string
          maxLength: 100
        telephone:
          type:
          - string
          - 'null'
          readOnly: true
        email_verifie:
          type: boolean
          readOnly: true
        telephone_verifie:
          type: boolean
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        statut_kyc:
          allOf:
          - $ref: '#/components/schemas/StatutKycEnum'
          readOnly: true
        date_creation:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_creation
      - email
      - email_verifie
      - id
      - nom
      - prenom
      - role
      - statut_kyc
      - telephone
      - telephone_verifie
