    TarifLivraison:
      type: object
      description: |-
        Administration. La zone et la commune d'un tarif ne changent plus
        après sa création (on crée un autre tarif) ; le tarif par défaut d'une
        zone ne se désactive pas : sans lui, plus aucune commande possible.

        Créer un tarif de commune dans la zone « abidjan » ajoute la commune au
        district : les adresses de cette commune passent en zone Abidjan. Une
        commune désactivée reste dans sa zone et prend le tarif par défaut.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        zone:
          $ref: '#/components/schemas/ZoneEnum'
        commune:
          type: string
          description: 'Vide : tarif par défaut de la zone.'
          maxLength: 100
        montant:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: FCFA payés par le client pour une commande (un colis).
        est_actif:
          type: boolean
        modifie_par:
          type:
          - integer
          - 'null'
          readOnly: true
        date_creation:
          type: string
          format: date-time
          readOnly: true
        date_mise_a_jour:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_creation
      - date_mise_a_jour
      - id
      - modifie_par
      - montant
      - zone
    TarifLivraisonRequest:
      type: object
      description: |-
        Administration. La zone et la commune d'un tarif ne changent plus
        après sa création (on crée un autre tarif) ; le tarif par défaut d'une
        zone ne se désactive pas : sans lui, plus aucune commande possible.

        Créer un tarif de commune dans la zone « abidjan » ajoute la commune au
        district : les adresses de cette commune passent en zone Abidjan. Une
        commune désactivée reste dans sa zone et prend le tarif par défaut.
      properties:
        zone:
          $ref: '#/components/schemas/ZoneEnum'
        commune:
          type: string
          description: 'Vide : tarif par défaut de la zone.'
          maxLength: 100
        montant:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: FCFA payés par le client pour une commande (un colis).
        est_actif:
          type: boolean
      required:
      - montant
      - zone
