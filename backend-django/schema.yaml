          type: integer
          maximum: 2147483647
          minimum: 0
          description: Seuil à partir duquel une notification de stock faible est
            émise
    PatchedSupportTicketRequest:
      type: object
      description: |-
        Ticket de support. Le contenu original (subject/description/order/
        product) est immuable après création : le client corrige ou précise via
        un nouveau message (TicketMessage), jamais en réécrivant la réclamation
        initiale. category/priority restent modifiables, mais uniquement par le
        staff (voir SupportRetrieveUpdateView.perform_update).

        `order` : une commande du demandeur ; `product` : un produit qu'il a
        acheté (dans cette commande si elle est donnée). `vendor` est déduit
        côté serveur (voir SupportTicketListCreateView.perform_create).
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
        category:
          $ref: '#/components/schemas/CategoryEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        order:
          type:
          - string
          - 'null'
          format: uuid
        product:
          type:
          - integer
          - 'null'
    PatchedTarifLivraisonRequest:
      type: object
      description: |-
        Administration. La zone et la commune d'un tarif ne changent plus
        après sa création (on crée un autre tarif) ; le tarif par défaut d'une
        zone ne se désactive pas : sans lui, plus aucune commande possible.

        Créer un tarif de commune dans la zone « abidjan » ajoute la commune au
        district : les adresses de cette commune passent en zone Abidjan. Une
        commune désactivée reste dans sa zone et prend le tarif par défaut.
      properties:
        zone:
          $ref: '#/components/schemas/ZoneEnum'
        commune:
          type: string
          description: 'Vide : tarif par défaut de la zone.'
          maxLength: 100
        montant:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: FCFA payés par le client pour une commande (un colis).
        est_actif:
          type: boolean
