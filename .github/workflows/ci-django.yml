name: CI Backend Django

on:
  push:
    branches: [main, backend-django]
    paths:
      - "backend-django/**"
      - ".github/workflows/ci-django.yml"
  pull_request:
    paths:
      - "backend-django/**"

defaults:
  run:
    working-directory: backend-django

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: anitche_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      DB_NAME: anitche_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend-django/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier les migrations (pas de modèle non migré)
        run: python manage.py makemigrations --check --dry-run

      # Schéma OpenAPI : aucun avertissement toléré, et le fichier versionné
      # (lu par le frontend, relu dans les PR) doit être à jour. En cas
      # d'échec : python manage.py spectacular --file schema.yaml
      - name: Vérifier le schéma OpenAPI (sans avertissement, schema.yaml à jour)
        run: |
          python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yaml
          diff -u schema.yaml /tmp/schema.yaml || {
            echo "::error file=backend-django/schema.yaml::schema.yaml n'est plus à jour : python manage.py spectacular --file schema.yaml"
            exit 1
          }

      - name: Lancer les tests
        run: python manage.py test