name: CI Backend Django

on:
  push:
    branches: [main, backend-django]
    paths:
      - "backend-django/**"
      - ".github/workflows/ci-django.yml"
  pull_request:
    paths:
      - "backend-django/**"

defaults:
  run:
    working-directory: backend-django

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: anitche_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_NAME: anitche_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend-django/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier les migrations (pas de modèle non migré)
        run: python manage.py makemigrations --check --dry-run

      - name: Lancer les tests
        run: python manage.py test
