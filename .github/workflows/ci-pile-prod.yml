name: CI Pile prod

# Démarre la vraie pile de production (infra/docker-compose.prod.yml) sur le
# runner et vérifie, par des requêtes à travers nginx, le routage, les
# statiques et médias, les quatre portails (une image chacune, sur leur
# sous-domaine : page, URL profonde, cache, CSP, API et médias sur la même
# origine), la route interne, les webhooks, la documentation fermée, le refus
# de démarrer de prod.py, le durcissement (Redis sans mot de passe refusé, rôle
# PostgreSQL non superutilisateur, conteneurs sans root), /admin/ fermé hors
# ADMIN_ALLOWED_CIDRS, les Host et SNI inconnus refusés, le rendu de nginx.conf
# pour un autre domaine, la sauvegarde avant migration (migrer.sh) et le
# certificat renouvelé servi sans intervention (infra/ci/smoke_prod.sh).
#
# Toute la pile tourne sur DOMAIN=staging.exemple.test : aucun nom de
# domaine n'est écrit en dur dans nginx.conf.
#
# Les images des portails sont celles de la production (frontend/Dockerfile.prod,
# une par portail) ; lint, types et tests du frontend relèvent de ci-frontend.yml.
#
# Ce que ce job ne teste pas :
#   - Let's Encrypt, Cloudflare, SMTP, GeniusPay et S3 : le certificat est
#     autosigné, les fournisseurs sont factices, la sauvegarde avant
#     migration va dans un dépôt restic local (infra/ci/docker-compose.ci.yml).
# Aucun fichier de production n'est modifié : tout vit dans infra/ci/.

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "backend-django/**"
      - "backend-fastapi/**"
      - "frontend/**"
      - ".github/workflows/ci-pile-prod.yml"
  pull_request:
    paths:
      - "infra/**"
      - "backend-django/**"
      - "backend-fastapi/**"
      - "frontend/**"
      - ".github/workflows/ci-pile-prod.yml"
  workflow_dispatch:

concurrency:
  group: ci-pile-prod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Nom commun à tous les appels docker compose du job.
  COMPOSE_PROJECT_NAME: anitche-ci
  # Domaine de la pile de CI (réservé aux tests), repris par l'environnement,
  # le certificat et les requêtes.
  DOMAIN: staging.exemple.test

jobs:
  pile-prod:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7

      - name: Résumé du job
        run: |
          {
            echo "### Pile de production : durée des étapes"
            echo
            echo "| Étape | Durée | Résultat |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "JOB_DEBUT=$(date +%s)" >> "$GITHUB_ENV"

      # Valeurs secrètes aléatoires (masquées dans les journaux), le reste en
      # constantes factices ; certificat autosigné pour DOMAIN.
      - name: Générer l'environnement et le certificat de CI
        run: |
          echo "ENV_CI=$RUNNER_TEMP/anitche-ci.env" >> "$GITHUB_ENV"
          echo "CI_CERT_DIR=$RUNNER_TEMP/certificat-ci" >> "$GITHUB_ENV"
          bash infra/ci/generer_env_ci.sh "$RUNNER_TEMP/anitche-ci.env"
          bash infra/ci/generer_certificat_ci.sh "$RUNNER_TEMP/certificat-ci"

      - name: check_prod_env.sh (valide accepté, variantes invalides refusées)
        timeout-minutes: 2
        run: bash infra/ci/etape.sh "check_prod_env.sh" bash infra/ci/verifier_environnement.sh "$ENV_CI"

      - name: Configuration compose (production et surcharge de CI)
        timeout-minutes: 2
        run: bash infra/ci/etape.sh "docker compose config" bash infra/ci/compose.sh config -q

      - name: Hygiène du compose (avertissements, environnement, journaux, modes)
        timeout-minutes: 2
        run: bash infra/ci/etape.sh "Hygiène du compose" bash infra/ci/verifier_compose.sh statique

      - name: Construire les images
        timeout-minutes: 15
        run: bash infra/ci/etape.sh "Construction des images" timeout 840 bash infra/ci/compose.sh build

      - name: Réglages de Gunicorn
        timeout-minutes: 3
        run: bash infra/ci/etape.sh "Réglages de Gunicorn" bash infra/ci/verifier_compose.sh gunicorn

      - name: prod.py refuse un environnement dangereux
        timeout-minutes: 5
        run: bash infra/ci/etape.sh "Refus de démarrer de prod.py" bash infra/ci/smoke_prod.sh refus_demarrage

      - name: Démarrer PostgreSQL et Redis
        timeout-minutes: 5
        run: bash infra/ci/etape.sh "db et redis" timeout 240 bash infra/ci/compose.sh up -d --wait --wait-timeout 120 db redis

      # Le script réel de déploiement : rôle anitche_app, propriétaire de la
      # base, avant les migrations qu'il exécute.
      - name: Rôle PostgreSQL applicatif
        timeout-minutes: 3
        run: |
          set -a
          # shellcheck source=/dev/null
          . "$ENV_CI"
          set +a
          export COMPOSE_FILE=infra/docker-compose.prod.yml
          bash infra/ci/etape.sh "Rôle applicatif anitche_app" timeout 120 bash infra/scripts/create_app_role.sh

      # Le script réel de déploiement (migrer.sh) : sauvegarde en échec
      # bloquante, sauvegarde puis migrations, rien en attente.
      - name: Migrations (migrer.sh, sauvegarde avant)
        timeout-minutes: 20
        run: bash infra/ci/etape.sh "Migrations et sauvegarde préalable" timeout 1140 bash infra/ci/smoke_prod.sh migrations

      # Le script réel de déploiement, sur le compose de production seul :
      # il ne s'adresse qu'au conteneur db déjà démarré.
      - name: Rôle PostgreSQL en lecture seule de FastAPI
        timeout-minutes: 3
        run: |
          set -a
          # shellcheck source=/dev/null
          . "$ENV_CI"
          set +a
          export COMPOSE_FILE=infra/docker-compose.prod.yml
          bash infra/ci/etape.sh "Rôle FastAPI en lecture seule" timeout 120 bash infra/scripts/create_fastapi_readonly_role.sh

      - name: Démarrer la pile (nginx, Django, FastAPI, worker, beat)
        timeout-minutes: 8
        run: bash infra/ci/etape.sh "Démarrage de la pile" timeout 300 bash infra/ci/compose.sh up -d --wait --wait-timeout 180 nginx celery-worker celery-beat

      - name: Attendre Django à travers nginx
        timeout-minutes: 3
        run: bash infra/ci/etape.sh "Attente de Django" bash infra/ci/smoke_prod.sh attendre

      - name: Requêtes à travers nginx
        timeout-minutes: 8
        run: bash infra/ci/etape.sh "Requêtes à travers nginx" bash infra/ci/smoke_prod.sh verifier

      # Recrée nginx, FastAPI et Django.
      - name: nginx démarre sans FastAPI et suit FastAPI et Django recréés
        timeout-minutes: 8
        run: bash infra/ci/etape.sh "Resolver nginx" bash infra/ci/smoke_prod.sh resolver

      # En dernier : recrée nginx avec un rechargement toutes les 10 s.
      - name: Certificat renouvelé servi sans intervention
        timeout-minutes: 3
        run: bash infra/ci/etape.sh "Rechargement périodique de nginx" bash infra/ci/smoke_prod.sh certificat

      # État et journaux de chaque conteneur : aucun secret n'y est écrit par
      # les applications, et le fichier d'environnement n'est jamais affiché.
      - name: Journaux des conteneurs (en cas d'échec)
        if: failure()
        timeout-minutes: 3
        run: |
          bash infra/ci/compose.sh ps -a || true
          bash infra/ci/compose.sh logs --no-color --tail=200 || true

      - name: Durée totale
        if: always()
        run: |
          total=$(( $(date +%s) - JOB_DEBUT ))
          printf '| **Total (hors checkout)** | **%s s** | |\n' "$total" >> "$GITHUB_STEP_SUMMARY"
