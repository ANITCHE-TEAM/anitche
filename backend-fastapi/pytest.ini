[pytest]
pythonpath = .
testpaths = tests
# pytest-timeout : 30 s au plus par test (les tests WebSocket bloqueraient
# sinon indéfiniment sur une fermeture jamais reçue).
timeout = 30
markers =
    integration: vrais services (PostgreSQL, Redis) ; sautés sans les variables FASTAPI_TEST_*, échec si REQUIRE_INTEGRATION=1
